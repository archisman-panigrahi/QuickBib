name: Translation Check

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  validate-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PO files
        run: python validate_po.py --validate
