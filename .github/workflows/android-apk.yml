name: Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      arch:
        description: "Target Android architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - armv7a
          - x86_64
      pyside_wheel_url:
        description: "Optional URL to a PySide6 Android wheel; leave empty to use the official Qt release wheel"
        required: false
        type: string
      shiboken_wheel_url:
        description: "Optional URL to the matching shiboken6 Android wheel; leave empty to use the official Qt release wheel"
        required: false
        type: string
      artifact_name:
        description: "GitHub artifact name"
        required: false
        default: "quickbib-android-apk"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET_ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
      PYSIDE_VERSION: "6.9.3"
      PYSIDE_WHEEL_URL: ${{ github.event.inputs.pyside_wheel_url || '' }}
      SHIBOKEN_WHEEL_URL: ${{ github.event.inputs.shiboken_wheel_url || '' }}
      APK_ARTIFACT_NAME: ${{ github.event.inputs.artifact_name || 'quickbib-android-apk' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            clang \
            cmake \
            git \
            libffi-dev \
            libtool \
            libtool-bin \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo6 \
            llvm \
            pkg-config \
            unzip \
            wget \
            zlib1g-dev \
            zip

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==$PYSIDE_VERSION" buildozer cython
          python -m pip install -r "$(python -c 'from pathlib import Path; import PySide6; print(Path(PySide6.__file__).resolve().parent / "scripts" / "requirements-android.txt")')"

      - name: Download Android SDK and NDK
        run: |
          git clone --depth 1 --branch "$PYSIDE_VERSION" https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install -r /tmp/pyside-setup/requirements.txt
          python -m pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --auto-accept-license

      - name: Reject incomplete wheel URL inputs
        if: ${{ (env.PYSIDE_WHEEL_URL == '') != (env.SHIBOKEN_WHEEL_URL == '') }}
        run: |
          echo "Provide both pyside_wheel_url and shiboken_wheel_url, or leave both empty."
          exit 1

      - name: Reject armv7a without wheel URLs
        if: ${{ env.TARGET_ARCH == 'armv7a' && env.PYSIDE_WHEEL_URL == '' && env.SHIBOKEN_WHEEL_URL == '' }}
        run: |
          echo "armv7a requires custom PySide6 and shiboken6 Android wheel URLs."
          exit 1

      - name: Download PySide6 Android wheels from URLs
        if: ${{ env.PYSIDE_WHEEL_URL != '' && env.SHIBOKEN_WHEEL_URL != '' }}
        run: |
          mkdir -p /tmp/pyside-android-wheels
          curl -L "$PYSIDE_WHEEL_URL" -o /tmp/pyside-android-wheels/pyside6-android.whl
          curl -L "$SHIBOKEN_WHEEL_URL" -o /tmp/pyside-android-wheels/shiboken6-android.whl
          echo "PYSIDE_ANDROID_WHEEL=/tmp/pyside-android-wheels/pyside6-android.whl" >> "$GITHUB_ENV"
          echo "SHIBOKEN_ANDROID_WHEEL=/tmp/pyside-android-wheels/shiboken6-android.whl" >> "$GITHUB_ENV"

      - name: Download PySide6 Android wheels from Qt releases
        if: ${{ env.TARGET_ARCH != 'armv7a' && env.PYSIDE_WHEEL_URL == '' && env.SHIBOKEN_WHEEL_URL == '' }}
        run: |
          mkdir -p /tmp/pyside-android-wheels
          PYSIDE_ANDROID_WHEEL="/tmp/pyside-android-wheels/PySide6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$TARGET_ARCH.whl"
          SHIBOKEN_ANDROID_WHEEL="/tmp/pyside-android-wheels/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$TARGET_ARCH.whl"
          curl -fL "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$TARGET_ARCH.whl" -o "$PYSIDE_ANDROID_WHEEL"
          curl -fL "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$TARGET_ARCH.whl" -o "$SHIBOKEN_ANDROID_WHEEL"
          echo "PYSIDE_ANDROID_WHEEL=$PYSIDE_ANDROID_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_ANDROID_WHEEL=$SHIBOKEN_ANDROID_WHEEL" >> "$GITHUB_ENV"

      - name: Validate Android wheel inputs
        run: |
          test -n "$PYSIDE_ANDROID_WHEEL"
          test -n "$SHIBOKEN_ANDROID_WHEEL"

      - name: Patch deployer for Android permissions
        run: python tools/patch_pyside_android_deploy.py

      - name: Build APK
        env:
          QUICKBIB_QT_API: pyside6
        run: |
          cp requirements-android.txt requirements.txt
          pyside6-android-deploy \
            --force \
            --wheel-pyside="$PYSIDE_ANDROID_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_ANDROID_WHEEL" \
            --name=QuickBib \
            --ndk-path="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c" \
            --sdk-path="$HOME/.pyside6_android_deploy/android-sdk"

      - name: Collect APK
        run: |
          mkdir -p dist/android
          find . -name "*.apk" -type f -exec cp {} dist/android/ \;
          test -n "$(find dist/android -name '*.apk' -type f -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: dist/android/*.apk
